<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Years of Us 💖</title>
  <meta name="description" content="เว็บฉลองวันครบรอบความรัก 2 ปี" />

  <!-- Favicon เป็นน้องอันยอง 🐱 -->
  <link rel="icon" type="image/png" href="images/cat.png" />
  <link rel="apple-touch-icon" href="images/cat.png" />

  <!-- Open Graph — รูป/ข้อความเวลาแชร์ลิงก์ -->
  <meta property="og:title" content="Two Years of Us 💖" />
  <meta property="og:description" content="Kittaya ❤️ Thanida · สองปีแห่งความทรงจำ" />
  <meta property="og:image" content="images/couple.png" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===================== หน้า INTRO ===================== -->
  <div class="intro" id="intro">
    <div class="intro-inner">
      <div class="intro-gift" id="introGift">🎁</div>
      <h1 class="intro-title" id="introTitle">Two Years of Us</h1>
      <p class="intro-sub" id="introSub">คลิกเพื่อเปิดของขวัญของเรา 💝</p>
      <button class="intro-btn" id="introBtn">เปิด 💕</button>
    </div>
    <div class="intro-hearts" aria-hidden="true"></div>
  </div>

  <!-- ภาพพื้นหลัง -->
  <div class="bg-image" id="bgImage" aria-hidden="true"></div>
  <!-- หัวใจลอยพื้นหลัง -->
  <div class="hearts-bg" id="heartsBg" aria-hidden="true"></div>

  <!-- ปุ่มเปิด/ปิดเพลง -->
  <button class="music-toggle" id="musicToggle" title="เปิด/ปิดเพลง" hidden>
    <span class="music-icon">🎵</span>
  </button>
  <audio id="bgMusic" loop></audio>
  <!-- ตัวเล่นเพลงจาก YouTube (ซ่อนไว้ เล่นเฉพาะเสียง) -->
  <div id="ytPlayer" aria-hidden="true"></div>

  <!-- ===================== HERO ===================== -->
  <header class="hero" id="hero">
    <div class="hero-inner">
      <p class="hero-badge" id="heroBadge">💑 Our Anniversary</p>
      <div class="hero-photo-wrap" id="heroPhotoWrap" hidden>
        <img id="heroPhoto" src="" alt="Kittaya & Thanida" class="hero-photo" />
      </div>
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-subtitle" id="heroSubtitle"></p>

      <!-- ตัวนับเวลา count-up -->
      <div class="counter" id="counter">
        <div class="counter-box"><span class="num" data-k="years">0</span><span class="lbl">ปี</span></div>
        <div class="counter-box"><span class="num" data-k="months">0</span><span class="lbl">เดือน</span></div>
        <div class="counter-box"><span class="num" data-k="days">0</span><span class="lbl">วัน</span></div>
        <div class="counter-box"><span class="num" data-k="totalDays">0</span><span class="lbl">วันรวม</span></div>
      </div>

      <!-- นับถอยหลังครบรอบถัดไป -->
      <div class="countdown" id="countdown">
        <p class="countdown-label">⏳ อีก <strong id="cdDays">–</strong> วัน ถึงวันครบรอบปีถัดไป</p>
      </div>

      <a href="#garden" class="scroll-hint">เลื่อนลงดูเรื่องราวของเรา ↓</a>
    </div>
  </header>

  <!-- ===================== GARDEN ===================== -->
  <section class="section section-garden" id="garden">
    <h2 class="section-title" id="gardenHeading">🌷 สวนดอกไม้ของเรา</h2>
    <p class="garden-sub" id="gardenSub"></p>
    <div class="garden" id="gardenField"></div>
    <!-- popup ข้อความเมื่อคลิกดอก -->
    <div class="flower-popup" id="flowerPopup" hidden>
      <button class="flower-popup-close" id="flowerPopupClose" aria-label="ปิด">&times;</button>
      <span class="flower-popup-icon">🌷</span>
      <h3 class="flower-popup-title" id="flowerPopupTitle"></h3>
      <p class="flower-popup-text" id="flowerPopupText"></p>
    </div>
  </section>

  <!-- ===================== REASONS ===================== -->
  <section class="section" id="reasons">
    <h2 class="section-title" id="reasonsHeading">💝 เหตุผลที่รักเธอ</h2>
    <p class="reasons-sub" id="reasonsSub"></p>
    <div class="reasons-grid" id="reasonsGrid"></div>
  </section>

  <!-- ===================== GALLERY ===================== -->
  <section class="section" id="gallery">
    <h2 class="section-title">🖼️ แกลเลอรีความทรงจำ</h2>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- ===================== LETTER ===================== -->
  <section class="section letter-section" id="letter">
    <div class="letter-card">
      <h2 class="letter-title" id="letterTitle"></h2>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-sign" id="letterSign"></p>
    </div>
  </section>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <p>สร้างด้วย ❤️ สำหรับวันครบรอบของเรา</p>
  </footer>

  <!-- Lightbox แสดงรูปใหญ่ -->
  <div class="lightbox" id="lightbox" hidden>
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img id="lightboxImg" src="" alt="" />
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
